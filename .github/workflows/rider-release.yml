name: Rider — Build & Deploy

on:
  push:
    tags:
      - 'rider-v*'      # git tag rider-v1.0.2 && git push --tags
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'android'
        type: choice
        options: [android, ios, both]

jobs:
  # ── Android ─────────────────────────────────────────────────────────────────
  android:
    name: Android — AAB → Play Store
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      github.event.inputs.platform == 'android' ||
      github.event.inputs.platform == 'both'
    defaults:
      run:
        working-directory: mobile/apps/rider_app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: stable
          cache: true

      - name: Flutter pub get — shared packages
        working-directory: mobile
        run: |
          cd packages/getgas_core && flutter pub get
          cd ../getgas_ui && flutter pub get

      - name: Flutter pub get
        run: flutter pub get

      - name: Decode keystore
        run: |
          echo "${{ secrets.RIDER_KEYSTORE_BASE64 }}" | base64 --decode > android/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.RIDER_STORE_PASSWORD }}
          keyAlias=${{ secrets.RIDER_KEY_ALIAS }}
          keyPassword=${{ secrets.RIDER_KEY_PASSWORD }}
          EOF

      # Backend URL + Maps key come from the committed config/production.json
      # and are embedded into the binary at build time.
      - name: Write native Maps key
        run: |
          touch android/local.properties
          echo "GOOGLE_MAPS_API_KEY=$(jq -r .GOOGLE_MAPS_API_KEY config/production.json)" >> android/local.properties

      - name: Build AAB
        run: flutter build appbundle --release --dart-define-from-file=config/production.json

      - name: Upload to Play Store (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.getgas.getgas_rider
          releaseFiles: mobile/apps/rider_app/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

  # ── iOS ──────────────────────────────────────────────────────────────────────
  ios:
    name: iOS — IPA → App Store
    runs-on: macos-15
    if: >
      github.event_name == 'push' ||
      github.event.inputs.platform == 'ios' ||
      github.event.inputs.platform == 'both'
    defaults:
      run:
        working-directory: mobile/apps/rider_app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: stable
          cache: true

      - name: Flutter pub get — shared packages
        working-directory: mobile
        run: |
          cd packages/getgas_core && flutter pub get
          cd ../getgas_ui && flutter pub get

      - name: Flutter pub get
        run: flutter pub get

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          p12-password: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}

      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_RIDER_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/rider_app.mobileprovision

      # Backend URL + Maps key embedded from committed config/production.json.
      - name: Build IPA
        run: flutter build ipa --release --dart-define-from-file=config/production.json --export-options-plist=ios/ExportOptions.plist

      - name: Upload to App Store Connect
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: mobile/apps/rider_app/build/ios/ipa/getgas_rider.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
