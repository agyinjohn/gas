name: getgas_rider
description: GetGas rider mobile app (Flutter).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.1
  geolocator: ^13.0.2
  shared_preferences: ^2.3.5
  socket_io_client: ^3.0.2
  google_maps_flutter: ^2.12.1
  google_maps_flutter_android: ^2.19.8
  google_maps_flutter_platform_interface: ^2.14.0
  getgas_core:
    path: ../../packages/getgas_core
  getgas_ui:
    path: ../../packages/getgas_ui
  flutter_polyline_points: ^3.1.0
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1
  flutter_background_service: ^5.0.6
  fl_chart: ^0.70.2
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: '#E87722'
  adaptive_icon_foreground: assets/images/app_icon.png
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: false

flutter_native_splash:
  color: '#ffffff'
  image: assets/images/splash_logo.png
  branding: assets/images/splash_branding.png
  branding_mode: bottom
  branding_bottom_padding: 40
  android_12:
    color: '#ffffff'
    image: assets/images/splash_logo.png
    icon_background_color: '#ffffff'
    branding: assets/images/splash_branding.png
  ios: true
  android: true
  fullscreen: false
