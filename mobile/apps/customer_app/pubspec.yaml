name: getgas_customer
description: GetGas customer mobile app (Flutter).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  flutter_secure_storage: ^9.2.4
  flutter_web_auth_2: ^4.1.0
  url_launcher: ^6.3.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  shared_preferences: ^2.3.5
  image_picker: ^1.1.2
  flutter_svg: ^2.0.17
  socket_io_client: ^3.0.2
  google_maps_flutter: ^2.12.1
  google_maps_flutter_android: ^2.19.8
  google_maps_flutter_platform_interface: ^2.14.0
  getgas_core:
    path: ../../packages/getgas_core
  getgas_ui:
    path: ../../packages/getgas_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/env/mobile.json
